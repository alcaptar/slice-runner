[package]
name = "slice-runner-tui"
version = "0.6.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
portable-pty = "0.9.0"
serde_json = "1.0.151"
tui-term = "0.3.4"
uuid = { version = "1.27.0", features = ["v4"] }
vt100 = "0.16.2"
nix = { version = "0.29.0", features = ["signal"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
wildcard_enum_match_arm = "deny"
